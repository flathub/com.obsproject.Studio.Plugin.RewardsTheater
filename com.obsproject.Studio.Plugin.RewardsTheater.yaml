id: com.obsproject.Studio.Plugin.RewardsTheater
branch: stable
runtime: com.obsproject.Studio
runtime-version: stable
sdk: org.freedesktop.Sdk//25.08
build-extension: true
separate-locales: false
build-options:
  prefix: /app/plugins/RewardsTheater
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - '*.a'
modules:
  - name: boost
    buildsystem: simple
    build-commands:
      - ./bootstrap.sh --prefix=/app/plugins/RewardsTheater --with-libraries=url,json
      - ./b2 cxxflags="-fPIC" cflags="-fPIC" -j $FLATPAK_BUILDER_N_JOBS install
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://archives.boost.io/release/1.91.0/source/boost_1_91_0.tar.bz2
        sha256: de5e6b0e4913395c6bdfa90537febd9028ea4c0735d2cdb0cd9b45d5f51264f5

  - name: rewardstheater
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    post-install:
      - install -Dm644 --target-directory=${FLATPAK_DEST}/share/metainfo /run/build/rewardstheater/${FLATPAK_ID}.metainfo.xml
    sources:
      - type: git
        url: https://github.com/gottagofaster236/RewardsTheater.git
        tag: 1.1.5
        commit: 05b40acefe0862dc49d59592ef1bc79c40fdd791
        x-checker-data:
          type: git
          is-main-source: true
          tag-pattern: ^([\d.]+)$
      - type: file
        path: com.obsproject.Studio.Plugin.RewardsTheater.metainfo.xml
